<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marrakesh 2026</title>
<meta name="description" content="Marrakeshi útitervünk – napok, helyek, térkép, tudnivalók. 2026. november 14–18.">
<meta name="theme-color" content="#b9472a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f6efe5; --surface:#fffaf3; --surface2:#f1e6d6; --ink:#2b1d16; --muted:#7a6656; --line:#e5d6c2;
  --terra:#b9472a; --terra-d:#8f3219; --blue:#2c47c5; --saffron:#d99a21; --green:#3d7a52; --plum:#7b3b6b; --sand:#a77a3f;
  --radius:16px; --shadow:0 1px 2px rgba(60,30,10,.06),0 6px 20px rgba(60,30,10,.08);
  --nav-h:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0}
a{color:var(--blue)}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}

/* ---------- header ---------- */
.hero{position:relative;color:#fff;min-height:210px;display:flex;align-items:flex-end;overflow:hidden;background:#3a2014}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,12,4,.15) 0%,rgba(30,12,4,.75) 100%)}
.hero-inner{position:relative;z-index:1;width:100%;max-width:1100px;margin:0 auto;padding:28px 16px 20px}
.hero h1{font-size:40px;line-height:1.05}
.hero p{margin:6px 0 0;opacity:.92}
.chip-status{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px}

/* ---------- nav ---------- */
.tabs{position:sticky;top:0;z-index:500;background:rgba(246,239,229,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs-inner{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:8px 12px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;padding:10px 8px;border-radius:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--terra);box-shadow:var(--shadow)}
@media (max-width:720px){
  .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
  .tabs-inner{padding:6px 6px}
  .tab{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 4px}
  .tab[aria-selected="true"]{box-shadow:none;background:transparent}
  body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
  .hero h1{font-size:34px}
}

main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.view{display:none}
.view.active{display:block}
.section-title{font-size:24px;margin:8px 0 4px}
.lead{color:var(--muted);margin:0 0 16px}

/* ---------- day picker ---------- */
.daypick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.daypick::-webkit-scrollbar{display:none}
.dp{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 14px;text-align:left;cursor:pointer;min-width:84px}
.dp b{display:block;font-size:13px}
.dp span{font-size:12px;color:var(--muted)}
.dp[aria-selected="true"]{background:var(--terra);border-color:var(--terra);color:#fff}
.dp[aria-selected="true"] span{color:rgba(255,255,255,.85)}
.dp .today{display:inline-block;background:var(--saffron);color:#fff;border-radius:6px;font-size:10px;padding:0 5px;margin-left:4px;vertical-align:1px}

.daycard{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dayhead{position:relative;color:#fff;min-height:150px;display:flex;align-items:flex-end;background:#3a2014}
.dayhead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8}
.dayhead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 20%,rgba(20,8,2,.8))}
.dayhead div{position:relative;z-index:1;padding:16px}
.dayhead small{font-weight:600;opacity:.9;text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.dayhead h2{font-size:26px;line-height:1.15}
.daybody{padding:6px 16px 16px}
.daynote{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:12px 0 4px;font-size:14px}
.daynote.warn{background:#fdecc8}
.tl{list-style:none;margin:8px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:59px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:48px 1fr;gap:26px;padding:9px 0;position:relative}
.tl li::before{content:"";position:absolute;left:54px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--terra)}
.tl li.opt::before{border-style:dashed;border-color:var(--muted)}
.tl .t{font-weight:700;font-size:13px;color:var(--terra-d);padding-top:3px;text-align:right;white-space:nowrap}
.tl .x{min-width:0}
.tl .x p{margin:0}
.tl .x .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.tl li.opt .x p{color:var(--muted)}
.tag-opt{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--surface2);color:var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.plink{display:flex;align-items:center;gap:10px;margin-top:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px;cursor:pointer;width:100%;text-align:left}
.plink img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:0 0 auto}
.plink b{font-size:14px;display:block;line-height:1.25}
.plink span{font-size:12px;color:var(--muted)}
.plink .chev{margin-left:auto;color:var(--muted);font-size:20px;padding-right:6px}
.daybtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.2}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.gyg{background:#ff5533;border-color:#ff5533;color:#fff}
.btn svg{width:16px;height:16px;flex:0 0 auto}

/* ---------- places ---------- */
.areafilter{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 10px;scrollbar-width:none}
.areafilter::-webkit-scrollbar{display:none}
.af{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.area{margin:22px 0 8px;scroll-margin-top:80px}
.area-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.area-head .num{width:34px;height:34px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:700;font-family:Fraunces,serif;flex:0 0 auto}
.area-head h2{font-size:21px;line-height:1.2}
.area-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:flex;gap:12px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;cursor:pointer;border:0;text-align:left;width:100%;border-left:4px solid var(--c,var(--terra));align-items:stretch}
.card img{width:92px;height:92px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--surface2)}
.card .ci{min-width:0;display:flex;flex-direction:column}
.card h3{font-size:16.5px;line-height:1.25}
.card .s{font-size:13.5px;color:var(--muted);margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--ink);border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.day{background:#e3e8fb;color:var(--blue)}

/* ---------- map ---------- */
#map{height:calc(100vh - 150px);height:calc(100dvh - 150px);min-height:380px;border-radius:var(--radius);box-shadow:var(--shadow);z-index:1}
@media (max-width:720px){#map{height:calc(100dvh - 130px - var(--nav-h) - env(safe-area-inset-bottom));margin:0 -16px;border-radius:0}}
.maptools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.mk{width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:12px}
.mk i{width:8px;height:8px;border-radius:50%;background:#fff;display:block}
.mk.home{background:#111 !important}
.mk.dim{opacity:.35}
.leaflet-popup-content{margin:12px 14px;font:14px/1.4 Inter,system-ui,sans-serif}
.pop b{font-size:15px;display:block;margin-bottom:2px}
.pop .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pop .btn{padding:6px 11px;font-size:13px}
.me-dot{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}

/* ---------- info ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.box{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.box h3{font-size:19px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.box ul{margin:0;padding-left:18px}
.box li{margin:5px 0}
.box p{margin:6px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.flight{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.flight:last-child{border-bottom:0}
.flight .code{font-weight:700;font-family:Fraunces,serif;font-size:20px}
.flight .arr{color:var(--muted)}
.flight small{display:block;color:var(--muted)}
.check{list-style:none;padding:0 !important}
.check li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);margin:0 !important}
.check li:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--green);flex:0 0 auto;margin-top:2px}
.check label{flex:1}
.check li.done label{text-decoration:line-through;color:var(--muted)}
.check a{font-size:13px;white-space:nowrap}
.phr{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.phr b{font-family:Fraunces,serif}
.sos{display:flex;gap:10px;flex-wrap:wrap}
.sos a{flex:1 1 90px;text-decoration:none;color:inherit;background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.sos a b{display:block;font-size:24px;font-family:Fraunces,serif;color:var(--terra)}
.credits{font-size:12px;color:var(--muted)}
.credits a{color:var(--muted)}
.warnbox{background:#fdecc8;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}

/* ---------- detail sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(25,12,5,.5);z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:1001;left:50%;top:50%;width:min(680px,94vw);max-height:90vh;transform:translate(-50%,-46%);opacity:0;pointer-events:none;background:var(--surface);border-radius:20px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);transition:transform .22s,opacity .22s;overscroll-behavior:contain}
.sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
@media (max-width:720px){
  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92dvh;border-radius:20px 20px 0 0;transform:translateY(100%);opacity:1}
  .sheet.open{transform:translateY(0)}
}
.sh-img{position:relative;aspect-ratio:16/9;background:var(--surface2)}
.sh-img img{width:100%;height:100%;object-fit:cover}
.sh-img .credit{position:absolute;right:8px;bottom:6px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:6px;text-decoration:none}
.sh-close{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;z-index:2}
.sh-body{padding:16px 18px 24px}
.sh-body h2{font-size:26px;line-height:1.15}
.sh-sub{color:var(--muted);margin:2px 0 10px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.facts div{background:var(--bg);border-radius:12px;padding:8px 10px;font-size:13px}
.facts small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
@media (max-width:480px){.facts{grid-template-columns:1fr 1fr}.facts div:last-child{grid-column:1/-1}}
.sh-body h3{font-size:16px;margin:16px 0 6px;font-family:Inter,system-ui,sans-serif;font-weight:700}
.tips{list-style:none;padding:0;margin:0}
.tips li{position:relative;padding:7px 0 7px 26px;border-bottom:1px solid var(--line)}
.tips li:last-child{border-bottom:0}
.tips li::before{content:"💡";position:absolute;left:0;top:7px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.approx{font-size:12px;color:var(--muted);margin-top:6px}
body.maptab .hero{display:none}
footer{max-width:1100px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>

<header class="hero">
  <img src="img/jemaa.jpg" alt="">
  <div class="hero-inner">
    <h1>Marrakesh</h1>
    <p>2026. november 14–18. · 4 fő · Riad Miel &amp; Une Nuit, Kasbah</p>
    <div class="chip-status" id="status"></div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <div class="tabs-inner">
    <button class="tab" role="tab" data-tab="napok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Napok</button>
    <button class="tab" role="tab" data-tab="helyek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Helyek</button>
    <button class="tab" role="tab" data-tab="terkep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Térkép</button>
    <button class="tab" role="tab" data-tab="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Infó</button>
  </div>
</nav>

<main>
  <section class="view" id="v-napok">
    <div class="daypick" id="daypick" role="tablist"></div>
    <div id="dayview"></div>
  </section>

  <section class="view" id="v-helyek">
    <h2 class="section-title">Helyek, közelség szerint</h2>
    <p class="lead">Ami egymás közelében van, az egy csoportban szerepel. Koppints egy helyre a részletekért, térképért, linkekért.</p>
    <div class="areafilter" id="areafilter"></div>
    <div id="areas"></div>
  </section>

  <section class="view" id="v-terkep">
    <div class="maptools" id="maptools"></div>
    <div id="map"></div>
  </section>

  <section class="view" id="v-info">
    <div id="info"></div>
  </section>
</main>

<footer id="footer"></footer>

<div class="scrim" id="scrim"></div>
<article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"></article>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================
   ADATOK – ezt a részt kell szerkeszteni, ha változik valami
   ========================================================= */

const GYG_OUZOUD = 'https://www.getyourguide.com/en-gb/marrakesh-l208/from-marrakech-ouzoud-waterfalls-guided-hike-and-boat-trip-t388884/';
const GYG_AGAFAY = 'https://www.getyourguide.com/en-gb/marrakesh-l208/marrakech-agafay-desert-quad-camel-rides-with-dinner-show-t486696/';
const MAJORELLE_TICKETS = 'https://tickets.jardinmajorelle.com/visite';

const AREAS = [
  { id:'kasbah', name:'Kasbah és Mellah – a szállás körül', color:'#b9472a',
    desc:'Déli medina. A szállástól minden 2–15 perc gyalog.' },
  { id:'jemaa', name:'Jemaa el-Fna és Koutoubia', color:'#d99a21',
    desc:'A főtér és környéke – a szállástól kb. 15–20 perc séta.' },
  { id:'north', name:'Souk-ok és az északi medina', color:'#3d7a52',
    desc:'A tértől északra: bazár, medresza, kertek. A tértől 5–20 perc.' },
  { id:'gueliz', name:'Gueliz – Majorelle környéke', color:'#2c47c5',
    desc:'Az új város, a medinán kívül. Taxival 10–15 perc.' },
  { id:'out', name:'Városon kívül', color:'#7b3b6b',
    desc:'Reptér, Menara-kert és a két egésznapos/félnapos túra.' },
];

// facts: [nyitva, jegy, időigény]; links: {l: felirat, u: url, k: 'off'|'ticket'|'gyg'|'maps'}
const PLACES = [
  // ---------- KASBAH ----------
  { id:'riad', q:'Riad Miel & Une Nuit, Derb Abda, Marrakech', area:'kasbah', name:'Riad Miel & Une Nuit', sub:'A szállásunk · 35 Derb Abda, Kasbah', img:'kasbahmosque',
    lat:31.6166, lng:-7.9885, approx:true,
    sum:'A szállás a Kasbah negyedben, pár percre a Szaadi-síroktól és a Bab Agnaou kaputól.',
    facts:['Bejelentkezés: nov. 14. (szo)','Kijelentkezés: nov. 18. (sze)','Cím: 35 Derb Abda, Kasbah, 40000'],
    factLabels:['Érkezés','Távozás','Cím'],
    det:['A medinai riadok szűk sikátorokban (derb) vannak, ahová autó nem jut be. A taxi a legközelebbi nagyobb útig vagy térig visz (a Kasbah-mecset / Bab Agnaou környéke), onnan pár perc gyalog.',
         'Az első alkalommal sokat segít, ha a riad embere elétek jön – a transzferrel ez általában benne van.'],
    tips:['Kérjétek a riadtól a reptéri transzfert mindkét irányba – hazafelé 3:30–3:45-ös indulással.',
          'Kérdezzétek meg, tudnak-e csomagolt reggelit adni az utolsó hajnalra.',
          'Mentsétek el a riad telefonszámát / WhatsAppját – ha eltévedtek, ki tudnak jönni elétek.'],
    links:[] },

  { id:'saadian', q:'Saadian Tombs, Marrakech', area:'kasbah', name:'Szaadi-sírok', sub:'Saadian Tombs · Tombeaux Saadiens', img:'saadian',
    lat:31.6173, lng:-7.9887,

/* ---------- date / status ---------- */
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const TODAY = todayISO();
const todayIdx = DAYS.findIndex(d => d.date === TODAY);
(function status(){
  const el = document.getElementById('status');
  const start = new Date('2026-11-14T07:50:00+01:00');
  const diff = Math.ceil((start - new Date()) / 86400000);
  if (todayIdx >= 0) el.textContent = '📍 Ma: ' + DAYNAMES[todayIdx] + ' – ' + DAYS[todayIdx].title;
  else if (diff > 0) el.textContent = '✈️ Még ' + diff + ' nap az indulásig';
  else el.textContent = '✨ Jó volt, ugye?';
})();

/* ---------- days ---------- */
let curDay = todayIdx >= 0 ? todayIdx : 0;
function renderDayPick(){
  document.getElementById('daypick').innerHTML = DAYS.map((d,i) =>
    `<button class="dp" role="tab" aria-selected="${i===curDay}" data-day="${i}"><b>${DAYNAMES[i]}${i===todayIdx?'<span class="today">MA</span>':''}</b><span>${d.short}</span></button>`).join('');
}
function placeLink(id){
  const p = P[id];
  return `<button class="plink" data-place="${id}"><img src="${img(p.img)}" alt="" loading="lazy"><div><b>${esc(p.name)}</b><span>${esc(A[p.area].name.split(' – ')[0])}</span></div><span class="chev">›</span></button>`;
}
function renderDay(){
  const d = DAYS[curDay];
  const mapPlaces = [...new Set(d.items.filter(i=>i.p).map(i=>i.p))];
  document.getElementById('dayview').innerHTML = `
    <article class="daycard">
      <div class="dayhead"><img src="${img(d.img)}" alt=""><div><small>${esc(d.label)}</small><h2>${esc(d.title)}</h2></div></div>
      <div class="daybody">
        ${d.warn ? `<div class="daynote warn">⚠️ ${esc(d.warn)}</div>` : ''}
        ${d.note ? `<div class="daynote">ℹ️ ${esc(d.note)}</div>` : ''}
        <ul class="tl">

/* ---------- detail sheet ---------- */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
let sheetOpen = false;
function linkBtn(l){

}
function openPlace(id){

        <a class="btn primary" href="${gm(p.q)}" target="_blank" rel="noopener">${ICON.maps}Google Maps</a>
        <a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.q)}&travelmode=${p.area==='out'||p.area==='gueliz'?'driving':'walking'}" target="_blank" rel="noopener">${ICON.walk}Útvonal ide</a>
        ${p.links.map(linkBtn).join('')}

/* ---------- map ---------- */
let map, markers = {}, routeLine, meMarker;
function markerIcon(p, idx, dim){
  const a = A[p.area];
  const home = p.id === 'riad';
  return L.divIcon({className:'', iconSize:[28,28], iconAnchor:[14,28], popupAnchor:[0,-26],
    html:`<div class="mk ${home?'home':''} ${dim?'dim':''}" style="background:${a.color}">${home?'<span>⌂</span>':(idx!=null?`<span>${idx}</span>`:'<i></i>')}</div>`});
}
function initMap(){
  if (map || typeof L === 'undefined') return;
  map = L.map('map', {zoomControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  PLACES.forEach(p => {
    const m = L.marker([p.lat,p.lng], {icon:markerIcon(p)}).addTo(map);
    m.bindPopup(`<div class="pop"><b>${esc(p.name)}</b><span style="color:#7a6656">${esc(p.sum)}</span>
      <div class="row"><button class="btn primary" data-place="${p.id}">Részletek</button><a class="btn" href="${gm(p.q)}" target="_blank" rel="noopener">Google Maps</a></div></div>`);
    markers[p.id] = m;
  });
  renderMapTools();
  fitCity();
}
function fitCity(){
  const ids = PLACES.filter(p => p.area!=='out').map(p=>p.id);
  map.fitBounds(L.latLngBounds(ids.map(id=>[P[id].lat,P[id].lng])), {padding:[30,30]});
}
let mapMode = {type:'all'};
function renderMapTools(){
  const dayBtns = DAYS.map((d,i)=>`<button class="af" data-mapday="${i}" style="${mapMode.type==='day'&&mapMode.day===i?'background:var(--terra);color:#fff;border-color:var(--terra)':''}">${DAYNAMES[i]}</button>`).join('');
  document.getElementById('maptools').innerHTML =
    `<button class="af" data-mapall style="${mapMode.type==='all'?'background:var(--terra);color:#fff;border-color:var(--terra)':''}">Minden hely</button>${dayBtns}
     <button class="af" data-locate>📍 Hol vagyok?</button>`;
}
function showAll(){
  mapMode = {type:'all'};
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  PLACES.forEach(p => markers[p.id].setIcon(markerIcon(p)));
  renderMapTools(); fitCity();
}
function showDayOnMap(i){
  mapMode = {type:'day', day:i};
  // A reptér és az opcionális programok ne húzzák szét a térképet (a sivatag és a Menara marad)
  let ids = [...new Set(DAYS[i].items.filter(it=>it.p && !it.opt && it.p!=='airport').map(it=>it.p))];
  if (ids.length < 2) ids = [...new Set(DAYS[i].items.filter(it=>it.p).map(it=>it.p))];
  PLACES.forEach(p => {
    const k = ids.indexOf(p.id);
    markers[p.id].setIcon(markerIcon(p, k>=0 ? k+1 : null, k<0));
  });
  if (routeLine) map.removeLayer(routeLine);
  routeLine = L.polyline(ids.map(id=>[P[id].lat,P[id].lng]), {color:'#b9472a', weight:3, dashArray:'6 8', opacity:.8}).addTo(map);
  map.fitBounds(routeLine.getBounds(), {padding:[40,40], maxZoom:16});
  renderMapTools();
}
function focusPlace(id){
  const p = P[id];
  map.setView([p.lat,p.lng], p.area==='out' ? 11 : 17);
  markers[id].openPopup();
}
function locate(){
  if (!navigator.geolocation) return alert('A böngésző nem támogatja a helymeghatározást.');
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (meMarker) map.removeLayer(meMarker);
    meMarker = L.marker(ll, {icon:L.divIcon({className:'', html:'<div class="me-dot"></div>', iconSize:[16,16], iconAnchor:[8,8]})}).addTo(map).bindPopup('Itt vagy');
    map.setView(ll, 16);
  }, () => alert('Nem sikerült a helymeghatározás. Engedélyezd a helyhozzáférést a böngészőnek.'), {enableHighAccuracy:true, timeout:10000});
}

/* ---------- routing ---------- */
const TABS = ['napok','helyek','terkep','info'];
let curTab = 'napok';
function showTab(t){
  if (!TABS.includes(t)) t = 'napok';
  curTab = t;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===t));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id==='v-'+t));
  document.getElementById('footer').style.display = t==='terkep' ? 'none' : '';
  document.body.classList.toggle('maptab', t==='terkep');
  if (t==='terkep') { initMap(); setTimeout(()=>map && map.invalidateSize(), 50); }
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('hely/')) { openPlace(h.slice(5)); return; }
  if (sheetOpen) closeSheet();
  showTab(h || 'napok');
}
function go(hash){ if (location.hash === '#'+hash) route(); else location.hash = hash; }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-day],[data-place],[data-close],[data-jump],[data-daymap],[data-mapday],[data-mapall],[data-locate],[data-showmap]');
  if (!t) return;
  if (t.dataset.tab) { go(t.dataset.tab); window.scrollTo({top:0}); }
  else if (t.dataset.day) { curDay = +t.dataset.day; renderDayPick(); renderDay(); }
  else if (t.dataset.place) { location.hash = 'hely/' + t.dataset.place; }
  else if (t.hasAttribute('data-close')) { history.length > 1 && location.hash.startsWith('#hely/') ? history.back() : go(curTab); }
  else if (t.dataset.jump) { document.getElementById('area-'+t.dataset.jump).scrollIntoView({behavior:'smooth'}); }
  else if (t.dataset.daymap) { go('terkep'); setTimeout(()=>showDayOnMap(+t.dataset.daymap), 80); }
  else if (t.dataset.mapday) { showDayOnMap(+t.dataset.mapday); }
  else if (t.hasAttribute('data-mapall')) { showAll(); }
  else if (t.hasAttribute('data-locate')) { locate(); }
  else if (t.dataset.showmap) { const id=t.dataset.showmap; location.hash='terkep'; setTimeout(()=>{ showAll(); focusPlace(id); }, 120); }
});
scrim.addEventListener('click', () => history.back());
document.addEventListener('keydown', e => { if (e.key==='Escape' && sheetOpen) history.back(); });
document.addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.check; if (!id) return;
  const o = loadChecks(); o[id] = e.target.checked; saveChecks(o);
  e.target.closest('li').classList.toggle('done', e.target.checked);
});
window.addEventListener('hashchange', route);

renderDayPick(); renderDay(); renderPlaces(); renderInfo();
// Ha a részletek URL-jével nyílik meg az oldal, a háttérben a Helyek fül legyen
if (location.hash.startsWith('#hely/')) showTab('helyek');
route();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
